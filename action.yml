name: cf-oidc-exchange
description: Exchange a GitHub OIDC token for a short-lived Cloudflare API token or R2 credentials
author: cf-contrib
branding:
  icon: cloud
  color: orange
inputs:
  broker-url:
    required: true
    description: Broker base URL, e.g. https://cf-oidc-exchange.example.com. Its origin is the OIDC audience.
  profile:
    required: false
    description: Policy profile to request (not an AWS profile). Recommended when more than one profile could match.
  ttl:
    required: false
    description: Requested token lifetime such as 10m or 1h (capped by the broker)
runs:
  using: node24
  main: packages/cf-oidc-action/src/main.js
  post: packages/cf-oidc-action/src/post.js
