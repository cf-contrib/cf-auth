name: cf-oidc-auth
description: Exchange a GitHub OIDC token for a short-lived Cloudflare API token
author: cf-contrib
branding:
  icon: cloud
  color: orange
inputs:
  broker-url:
    required: true
    description: cf-auth broker base URL, e.g. https://cf-auth.example.com. Its origin is the OIDC audience.
  profile:
    required: false
    description: Policy profile to request (not an AWS profile). Recommended when more than one profile could match.
  ttl:
    required: false
    description: Requested token lifetime such as 10m or 1h (capped by the broker)
  r2-credentials:
    required: false
    default: "false"
    description: Also export S3-compatible R2 credentials derived from the token (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_ENDPOINT_URL_S3, AWS_REGION), for aws s3, the s3 backend and other S3 tools
runs:
  using: node24
  main: packages/cf-oidc-action/src/main.js
  post: packages/cf-oidc-action/src/post.js
