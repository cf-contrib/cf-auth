name: cf-auth
description: Exchange a GitHub OIDC token for a short-lived Cloudflare API token
author: cf-contrib
branding:
  icon: cloud
  color: orange
inputs:
  broker-url:
    required: true
    description: cf-auth broker base URL, e.g. https://cf-auth.example.com. Its origin is the OIDC audience.
  rule:
    required: false
    description: Policy rule name. Recommended when more than one rule could match.
  ttl:
    required: false
    description: Requested token lifetime such as 10m or 1h (capped by the broker)
  s3-credentials:
    required: false
    default: "false"
    description: Also export R2 S3 API credentials derived from the token (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_ENDPOINT_URL_S3, AWS_REGION)
runs:
  using: node24
  main: packages/cf-auth-action/src/main.js
  post: packages/cf-auth-action/src/post.js
