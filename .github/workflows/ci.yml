name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
      - name: Setup Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-flakehub: disabled
          use-gha-cache: enabled
      - name: Install
        run: nix develop --command pnpm install --frozen-lockfile
      - name: Lint
        run: nix develop --command pnpm lint
      - name: Typecheck
        run: nix develop --command pnpm typecheck
      - name: Test
        run: nix develop --command pnpm test
      - name: Build
        run: nix develop --command pnpm build
      - name: Check Bundle
        run: nix develop --command pnpm --filter cf-oidc-broker check:bundle
      - name: Validate Terraform Module
        working-directory: packages/cf-oidc-broker/terraform
        run: |
          nix develop --command tofu fmt -check -recursive
          nix develop --command tofu init -backend=false
          nix develop --command tofu validate
          nix develop --command tofu test

  # Runs the action from a fresh checkout with nothing installed, against a stub
  # broker that also stands in for the runner's OIDC endpoint. Catches runtime
  # imports from outside packages/cf-oidc-action and broken action.yml paths.
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Start Stub Broker
        run: |
          node packages/cf-oidc-action/test/stub.js > "$RUNNER_TEMP/stub.log" 2>&1 &
          for _ in $(seq 20); do grep -q listening "$RUNNER_TEMP/stub.log" && exit 0; sleep 0.5; done
          cat "$RUNNER_TEMP/stub.log"; exit 1
      - name: Leave Stale AWS Credentials
        run: |
          echo "AWS_ACCESS_KEY_ID=stale-access-key-id" >> "$GITHUB_ENV"
          echo "AWS_SESSION_TOKEN=stale-session-token" >> "$GITHUB_ENV"
      # The stub answers profile smoke-r2 as a profile with one bucket and no token, and
      # smoke-r2-multi as one with two buckets.
      - name: Run cf-oidc-auth (r2 only)
        uses: ./
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: http://127.0.0.1:8787/oidc?api-version=2.0
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: stub-request-token
        with:
          broker-url: http://127.0.0.1:8787
          profile: smoke-r2
      - name: Check Exported R2 Credentials
        run: |
          test -z "$CLOUDFLARE_API_TOKEN"   # r2 only: no API token
          test "$CLOUDFLARE_ACCOUNT_ID" = 0123456789abcdef0123456789abcdef
          test "$AWS_ACCESS_KEY_ID" = stub-r2-access-key-id   # replaces the stale one
          test "$AWS_SECRET_ACCESS_KEY" = stub-r2-secret-access-key
          test "$AWS_SESSION_TOKEN" = stub-r2-session-token
          test "$AWS_SECURITY_TOKEN" = stub-r2-session-token
          test "$AWS_ENDPOINT_URL_S3" = https://0123456789abcdef0123456789abcdef.r2.cloudflarestorage.com
          test "$AWS_REGION" = auto
          test "$AWS_DEFAULT_REGION" = auto
          test "$CLOUDFLARE_R2_BUCKET" = org-terraform-state
          test "$CLOUDFLARE_R2_PREFIX" = github.com/example-org/app/
          test "$AWS_SHARED_CREDENTIALS_FILE" = "$RUNNER_TEMP/cf-oidc/credentials"
          test "$(stat -c %a "$AWS_SHARED_CREDENTIALS_FILE")" = 600
          # The same credentials as a named profile.
          test "$(aws configure get aws_access_key_id --profile org-terraform-state)" = stub-r2-access-key-id
      - name: Run cf-oidc-auth (two buckets)
        uses: ./
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: http://127.0.0.1:8787/oidc?api-version=2.0
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: stub-request-token
        with:
          broker-url: http://127.0.0.1:8787
          profile: smoke-r2-multi
      - name: Check Exported AWS Profiles
        run: |
          test -z "$AWS_ACCESS_KEY_ID"   # no default: the one-bucket run's is cleared
          test -z "$AWS_SECRET_ACCESS_KEY"
          test -z "$AWS_SESSION_TOKEN"
          test -z "$CLOUDFLARE_R2_BUCKET"
          test -z "$CLOUDFLARE_R2_PREFIX"
          test "$AWS_ENDPOINT_URL_S3" = https://0123456789abcdef0123456789abcdef.r2.cloudflarestorage.com
          test "$(aws configure get aws_access_key_id --profile org-terraform-state)" = stub-r2-access-key-id
          test "$(aws configure get aws_access_key_id --profile org-artifacts)" = stub-r2-access-key-id-2
          test "$CLOUDFLARE_R2_BUCKETS" = '{"org-terraform-state":["github.com/example-org/app/"],"org-artifacts":[]}'
      - name: Run cf-oidc-auth (token)
        uses: ./
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: http://127.0.0.1:8787/oidc?api-version=2.0
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: stub-request-token
        with:
          broker-url: http://127.0.0.1:8787
          profile: smoke
          ttl: 5m
      - name: Check Exported Token
        run: |
          test "$CLOUDFLARE_API_TOKEN" = stub-cloudflare-token
          test "$CLOUDFLARE_ACCOUNT_ID" = 0123456789abcdef0123456789abcdef
          test "${{ env.CLOUDFLARE_ACCOUNT_ID }}" = 0123456789abcdef0123456789abcdef

  release:
    needs: [test, smoke]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create Release PR
        id: release
        uses: googleapis/release-please-action@v5
        with:
          manifest-file: .github/config/release-please-manifest.json
          config-file: .github/config/release-please-config.json
          target-branch: main

  publish:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag_name }}
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
      - name: Setup Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-flakehub: disabled
          use-gha-cache: enabled
      - name: Build
        run: |
          nix develop --command pnpm install --frozen-lockfile
          nix develop --command pnpm build
          cd packages/cf-oidc-broker/dist && sha256sum broker.js > broker.js.sha256
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release.outputs.tag_name }}
          files: |
            packages/cf-oidc-broker/dist/broker.js
            packages/cf-oidc-broker/dist/broker.js.sha256
