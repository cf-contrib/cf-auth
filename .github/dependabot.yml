version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      all-actions:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "github-actions"
      - "auto-merge"
    commit-message:
      prefix: "chore"
      include: "scope"
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/packages/*"
    schedule:
      interval: "weekly"
    # Matches pnpm's minimumReleaseAge gate, so updates don't fail install.
    cooldown:
      default-days: 3
    ignore:
      # @cloudflare/vitest-pool-workers supports vitest 4 only; bump it together with the pool.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      # The action runs on node24; keep the types on the same major.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 10
    groups:
      all-npm:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "auto-merge"
    commit-message:
      prefix: "chore"
      include: "scope"
  - package-ecosystem: "terraform"
    directory: "/packages/cf-auth-broker/terraform"
    schedule:
      interval: "weekly"
    groups:
      all-terraform:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "auto-merge"
    commit-message:
      prefix: "chore"
      include: "scope"
