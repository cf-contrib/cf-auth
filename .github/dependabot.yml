version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      all-actions:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "github-actions"
      - "auto-merge"
    commit-message:
      prefix: "chore"
      include: "scope"
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/action"
    schedule:
      interval: "weekly"
    # Matches pnpm's minimumReleaseAge gate, so updates don't fail install.
    cooldown:
      default-days: 3
    ignore:
      # The action runs on node24; keep the types on the same major.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 10
    groups:
      all-npm:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "auto-merge"
    commit-message:
      prefix: "chore"
      include: "scope"
  - package-ecosystem: "terraform"
    directory: "/deployment/terraform"
    schedule:
      interval: "weekly"
    groups:
      all-terraform:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "auto-merge"
    commit-message:
      prefix: "chore"
      include: "scope"
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # The integration tests seed rsa 0.9's key generation with rand_chacha,
      # which must implement the rand_core rsa does: 0.6, so rand_chacha 0.3.
      # Move both together, once rsa moves to a newer rand_core.
      - dependency-name: "rand_chacha"
        versions: [">= 0.4"]
    open-pull-requests-limit: 10
    groups:
      all-cargo:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "auto-merge"
    commit-message:
      prefix: "chore"
      include: "scope"
