# The broker's OAuth contract. crates/cf-oidc-exchange-sdk generates the Rust
# types, server and client from it; keep action/src/api.ts, which
# the action type-checks against, in step.
openapi: 3.1.0
info:
  title: cf-oidc-exchange
  version: "1"
  description: >-
    Bodies are form-encoded, and errors are OAuth errors (RFC 6749 §5.2), as RFC 8693 and
    RFC 7009 have it.

    Exchanges an OIDC token for short-lived Cloudflare credentials, or for an access token
    the broker signs for another service (RFC 8693 token exchange at `POST /oauth/token`;
    RFC 9068), and revokes Cloudflare tokens (RFC 7009 at `POST /oauth/revoke`). Services
    find the keys to verify the broker's tokens through its metadata (RFC 8414).
servers:
  - url: https://cf-oidc-exchange.example.com
tags:
  - name: ExchangeService
    description: Token exchange and revocation, and the metadata to verify the broker's own tokens.
paths:
  /oauth/token:
    post:
      operationId: exchangeToken
      tags: [ExchangeService]
      summary: Exchange an OIDC token for a Cloudflare API token and/or R2 credentials.
      description: >-
        The subject token is in the body, not an `Authorization` header. Which profile
        applies follows the policy: a named `profile` must match, otherwise exactly one
        profile must. Anything unsupported, such as `actor_token`, is refused rather than
        ignored. An invalid subject token, or one the policy doesn't take, is
        `invalid_request`, as RFC 8693 §2.2.2 has it; an `audience` the broker issues
        nothing for is `invalid_target`.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/TokenExchangeRequest"
      responses:
        "200":
          description: Issued. A profile with only buckets returns no `access_token` and `token_type` `N_A`.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenExchangeResponse"
        "400":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /oauth/revoke:
    post:
      operationId: revokeToken
      tags: [ExchangeService]
      summary: Revoke a Cloudflare API token the broker minted.
      description: >-
        Holding the token is the proof. Answers `200` whether the token was revoked, already
        gone, never valid, or not one the broker minted, which it never deletes: to the
        broker, that's an invalid token, which RFC 7009 §2.2 answers with `200` too.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/TokenRevocationRequest"
      responses:
        "200":
          description: Revoked, already gone, never valid, or not the broker's. No body.
        "400":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /.well-known/oauth-authorization-server:
    get:
      operationId: metadata
      tags: [ExchangeService]
      summary: The broker's Authorization Server Metadata (RFC 8414), with its keys and endpoints.
      description: >-
        Tokens come from exchange only, so there's no authorization endpoint, and the broker
        issues no ID tokens: it's an OAuth authorization server, not an OpenID Provider, so
        it publishes no `/.well-known/openid-configuration`.
      responses:
        "200":
          description: The metadata. Cacheable for 5 minutes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationServerMetadata"
        "500":
          $ref: "#/components/responses/Error"
  /.well-known/jwks:
    get:
      operationId: jwks
      tags: [ExchangeService]
      summary: The public key the broker signs its own tokens with.
      responses:
        "200":
          description: A JWK Set. Empty when no signing key is bound. Cacheable for 5 minutes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Jwks"
        "500":
          $ref: "#/components/responses/Error"
components:
  responses:
    Error:
      description: >-
        An OAuth error (RFC 6749 §5.2): 400 for the caller's mistakes, 500 (`server_error`)
        when the broker is misconfigured or fails, 503 (`temporarily_unavailable`) when
        Cloudflare or the subject token's issuer fail. For the caller's own mistakes, the
        description says what was wrong; for the broker's faults it's generic, and the
        broker's logs say why.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    TokenRevocationRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 8192
        token_type_hint:
          type: string
          const: access_token
          description: Ignored; only Cloudflare API tokens the broker minted can be revoked.
    TokenExchangeRequest:
      type: object
      required: [grant_type, subject_token, subject_token_type]
      properties:
        grant_type:
          type: string
          const: urn:ietf:params:oauth:grant-type:token-exchange
        subject_token:
          type: string
          minLength: 1
          maxLength: 8192
          description: An OIDC token from an issuer the policy names as a provider.
        subject_token_type:
          type: string
          enum:
            - urn:ietf:params:oauth:token-type:id_token
            - urn:ietf:params:oauth:token-type:jwt
          description: An OIDC token, as `id_token` or `jwt`.
        audience:
          type: string
          maxLength: 200
          default: https://api.cloudflare.com
          description: >-
            `https://api.cloudflare.com` for Cloudflare credentials, or the URL of a service
            the policy issues the broker's own tokens for.
        requested_token_type:
          $ref: "#/components/schemas/IssuedTokenType"
        profile:
          type: string
          maxLength: 64
          description: Profile to use. If omitted, exactly one profile must match.
        ttl:
          type: string
          maxLength: 16
          description: Requested lifetime such as `10m` or `1h`, capped at the profile's `max_ttl`.
    IssuedTokenType:
      type: string
      enum:
        - urn:ietf:params:oauth:token-type:access_token
        - urn:cf-oidc-auth:params:oauth:token-type:r2-credentials
        - urn:ietf:params:oauth:token-type:jwt
    TokenExchangeResponse:
      type: object
      required: [issued_token_type, token_type, expires_in, expires_at, profile]
      properties:
        access_token:
          type: string
          description: >-
            The Cloudflare API token, absent for a profile with only buckets; or, for a
            service's audience, the JWT access token (RFC 9068, `typ` `at+jwt`) the broker
            signed.
        issued_token_type:
          $ref: "#/components/schemas/IssuedTokenType"
        token_type:
          type: string
          enum: [Bearer, N_A]
        expires_in:
          type: integer
          minimum: 0
          description: Seconds until the token, or the R2 credentials, expire.
        expires_at:
          type: integer
          description: Unix time in seconds.
        token_id:
          type: string
          description: The Cloudflare API token's ID, present with `access_token`.
        account_id:
          type: string
          description: The Cloudflare account, for the Cloudflare audience.
        profile:
          type: string
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/BucketCredentials"
    BucketCredentials:
      type: object
      description: S3 credentials for one R2 bucket, limited to `prefixes`. They can't be revoked; they expire.
      required: [name, access_key_id, secret_access_key, session_token, prefixes, endpoint, expires_on]
      properties:
        name:
          type: string
        access_key_id:
          type: string
        secret_access_key:
          type: string
        session_token:
          type: string
        prefixes:
          type: array
          items:
            type: string
          description: Filled in from the caller's claims. Empty means the whole bucket.
        endpoint:
          type: string
          description: "`https://<account_id>.r2.cloudflarestorage.com`"
        expires_on:
          type: string
          format: date-time
    AuthorizationServerMetadata:
      type: object
      description: Authorization Server Metadata (RFC 8414 §2).
      required:
        [issuer, jwks_uri, token_endpoint, revocation_endpoint, response_types_supported, grant_types_supported]
      properties:
        issuer:
          type: string
          description: Exactly the `iss` of the broker's tokens, so no trailing slash.
        jwks_uri:
          type: string
          format: uri
        token_endpoint:
          type: string
          format: uri
        revocation_endpoint:
          type: string
          format: uri
        response_types_supported:
          type: array
          items:
            type: string
          description: Empty, since there's no authorization endpoint for a response type to be for.
        grant_types_supported:
          type: array
          items:
            type: string
        token_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
        revocation_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
    Jwks:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            required: [kty, n, e, kid, alg, use]
            properties:
              kty:
                type: string
                const: RSA
              n:
                type: string
              e:
                type: string
              kid:
                type: string
              alg:
                type: string
                const: RS256
              use:
                type: string
                const: sig
    Error:
      type: object
      description: An OAuth error response (RFC 6749 §5.2).
      required: [error, error_description]
      properties:
        error:
          $ref: "#/components/schemas/ErrorCode"
        error_description:
          type: string
          description: What went wrong.
    ErrorCode:
      type: string
      description: >-
        RFC 6749's error codes (§5.2, and §4.1.2.1 for the broker's own faults) and RFC
        8693's `invalid_target`.
      enum:
        - invalid_request
        - invalid_target
        - unsupported_grant_type
        - server_error
        - temporarily_unavailable
