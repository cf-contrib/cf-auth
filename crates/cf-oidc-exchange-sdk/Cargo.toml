[package]
name = "cf-oidc-exchange-sdk"
version = "0.8.0"
edition = "2024"
authors = ["iamralch"]
readme = "README.md"

[dependencies]
# The model types, which every mode of the generated code shares.
serde = { version = "1", features = ["derive"] }
# RFC 3339 timestamps (a bucket's expires_on) and URLs (the discovery document's).
chrono = { version = "0.4", features = ["serde"] }
url = { version = "2", features = ["serde"] }
# JSON responses, for the server and the client alike.
serde_json = { version = "1", optional = true }

# The server side: a trait per tag and an axum router over it, behind the
# `server` feature. jsonschema validates requests against the spec at the HTTP
# boundary, before they reach a handler; serde_urlencoded reads the form bodies
# RFC 8693 and RFC 7009 call for.
async-trait = { version = "0.1", optional = true }
axum = { version = "0.8", default-features = false, features = ["json"], optional = true }
http-body-util = { version = "0.1", optional = true }
jsonschema = { version = "0.49", default-features = false, optional = true }
mime = { version = "0.3", optional = true }
serde_urlencoded = { version = "0.7", optional = true }

# The client side, behind the `client` feature, so the Worker compiles no HTTP
# client.
futures-util = { version = "0.3", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"], optional = true }
reqwest-middleware = { version = "0.5", optional = true }
thiserror = { version = "2", optional = true }

[features]
# ExchangeServiceApi, and the router that serves it. What the Worker implements.
server = [
  "dep:async-trait",
  "dep:axum",
  "dep:http-body-util",
  "dep:jsonschema",
  "dep:mime",
  "dep:serde_json",
  "dep:serde_urlencoded",
]
# HttpClient, a typed client for every operation.
client = [
  "dep:futures-util",
  "dep:reqwest",
  "dep:reqwest-middleware",
  "dep:serde_json",
  "dep:serde_urlencoded",
  "dep:thiserror",
]

[build-dependencies]
# Generates the API from the OpenAPI document, in build.rs. Without the `cli`
# default it is only the library: no clap, no reqwest.
openapi-to-rust = { version = "0.19", default-features = false }
