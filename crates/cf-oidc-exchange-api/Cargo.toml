[package]
name = "cf-oidc-exchange-api"
version = "0.8.0"
edition = "2024"
authors = ["iamralch"]

[lib]
crate-type = ["cdylib"]

[dependencies]
# `http` hands `fetch` an http::Request, which the SDK's axum router takes.
worker = { version = "0.8", features = ["http", "axum"] }

# The API: its types, and the traits and router the Worker implements.
cf-oidc-exchange-sdk = { path = "../cf-oidc-exchange-sdk", features = ["server"] }
# Verifies the OIDC tokens exchanges present, and signs the broker's own.
cf-oidc-core = { path = "../cf-oidc-core" }
# Named by the generated traits and router; the versions the SDK builds with.
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["json"] }
# The auth layer: a tower Layer and Service over the API's routes, which reads
# the exchange's form body as the generated router does.
tower-layer = "0.3"
tower-service = "0.3"
serde_urlencoded = "0.7"

# The Cloudflare API: account tokens and R2 temporary credentials.
cloudflare = { git = "https://github.com/cf-contrib/cloudflare-rs", rev = "ad55f44cd43f87d73c25672a1d7b15199a6c08f0", features = ["accounts", "r2", "client"] }

# The policy, and the claims of the broker's own tokens.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Expiry, as the tokens API and the responses take it.
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }

# Logs, as JSON lines to the console, which Workers Logs indexes.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "std"] }
tracing-web = "0.1"

[dev-dependencies]
# The integration tests ask the health endpoints with the SDK's client.
cf-oidc-exchange-sdk = { path = "../cf-oidc-exchange-sdk", features = ["client"] }
# The integration tests' stand-ins for the OIDC issuers and Cloudflare,
# served over axum on tokio, and their calls to the Worker over reqwest.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "form"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
# Signs the stand-in issuers' tokens and verifies the broker's, with keys made
# from fixed seeds. Only in the tests: the Worker signs with WebCrypto.
rand_chacha = "0.10"
base64 = "0.23"
rsa = { version = "0.9", features = ["sha2"] }

[features]
# Opt-in integration tests which require `wrangler dev` running locally.
integration = []
# For the integration tests, never a release: CF_OIDC_EXCHANGE_API_CLOUDFLARE_URL
# points the Worker at the tests' stand-in for Cloudflare's API.
stand-ins = []
