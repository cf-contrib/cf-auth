[package]
name = "cf-oidc-exchange-api"
version = "0.8.0"
edition = "2024"
authors = ["iamralch"]

[lib]
crate-type = ["cdylib"]

[dependencies]
# `http` hands `fetch` an http::Request, which the SDK's axum router takes.
worker = { version = "0.8", features = ["http", "axum"] }

# The API: its types, and the traits and router the Worker implements.
cf-oidc-exchange-sdk = { path = "../cf-oidc-exchange-sdk", features = ["server"] }
# Named by the generated traits and router; the versions the SDK builds with.
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["json"] }
tower-service = "0.3"

# The Cloudflare API: account tokens and R2 temporary credentials.
# Pinned to cf-contrib/cloudflare-rs#3 (token policy id, open scopes) until it merges.
cloudflare = { git = "https://github.com/cf-contrib/cloudflare-rs", rev = "bf8bd31bf2b456b6bc99d9e2171debf591d992e0", features = ["accounts", "r2", "client"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The policy: errors by the path of the field they're about, claim patterns, URLs.
serde_path_to_error = "0.1"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl"] }
url = "2"

# Calls GitHub, and issuers' discovery documents and keys. Already in the tree
# via `cloudflare`.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
futures-util = { version = "0.3", default-features = false }
# JWT segments, PEMs, and the timestamps of the tokens API.
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
# WebCrypto bindings for RS256, so no RSA crate ends up in the wasm bundle.
web-sys = { version = "0.3", features = ["Crypto", "CryptoKey", "SubtleCrypto", "WorkerGlobalScope"] }

[dev-dependencies]
# The integration tests ask the health endpoints with the SDK's client.
cf-oidc-exchange-sdk = { path = "../cf-oidc-exchange-sdk", features = ["client"] }
# The integration tests' stand-ins for the OIDC issuers, GitHub and Cloudflare,
# served over axum on tokio, and their calls to the Worker over reqwest.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "form"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
# Signs the stand-in issuers' tokens and verifies the broker's, with keys made
# from fixed seeds. Only in the tests: the Worker signs with WebCrypto.
rand_chacha = "0.3"
rsa = { version = "0.9", features = ["sha2"] }

[features]
# Opt-in integration tests which require `wrangler dev` running locally.
integration = []
# For the integration tests, never a release: CF_OIDC_EXCHANGE_API_GITHUB_URL
# and CF_OIDC_EXCHANGE_API_CLOUDFLARE_URL point the Worker at the tests'
# stand-ins, and CF_OIDC_EXCHANGE_API_SCENARIO_URL at the policy, account and
# bindings each test chooses.
stand-ins = []
