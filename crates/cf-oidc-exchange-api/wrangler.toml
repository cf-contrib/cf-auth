# The Worker under `wrangler dev`: the integration tests' setup, as
# cf-nix-cache's is. A `stand-ins` build takes Cloudflare's API from the tests'
# stand-ins, and its policy's providers are the stand-ins' issuers, which the
# tests serve on 127.0.0.1:8791 while they run. tests/run.sh creates the
# secrets in a local store and runs the tests against it. Releases are built
# without `stand-ins`, and deployed with deployment/terraform.
name = "cf-oidc-exchange"
main = "build/index.js"
compatibility_date = "2026-08-15"

[build]
command = "worker-build --dev --features stand-ins"

# The policy's issuer and providers' audience.
[dev]
port = 8790

[observability]
enabled = true

[triggers]
crons = ["17 * * * *"] # hourly cleanup of expired cf-oidc:* tokens

[vars]
CF_OIDC_EXCHANGE_API_ACCOUNT_ID = "0123456789abcdef0123456789abcdef"
CF_OIDC_EXCHANGE_API_CLOUDFLARE_URL = "http://127.0.0.1:8791/cloudflare/client/v4"
# `mismatched`'s discovery document names another issuer, and so does
# `pinned`'s, whose keys are at its jwks_uri. `typed` takes only access tokens,
# which the stand-ins don't sign.
CF_OIDC_EXCHANGE_API_POLICY = '''
{
  "version": 3,
  "issuer": "http://127.0.0.1:8790",
  "providers": [
    { "name": "github", "issuer": "http://127.0.0.1:8791/issuers/actions", "audience": "http://127.0.0.1:8790", "claims": [{ "repository_owner_id": "100000001" }] },
    { "name": "gitlab", "issuer": "http://127.0.0.1:8791/issuers/gitlab", "audience": "http://127.0.0.1:8790", "claims": [{ "namespace_id": "4000001" }] },
    { "name": "mismatched", "issuer": "http://127.0.0.1:8791/issuers/mismatched", "audience": "http://127.0.0.1:8790", "claims": [{ "namespace_id": "4000001" }] },
    { "name": "pinned", "issuer": "http://127.0.0.1:8791/issuers/pinned", "audience": "http://127.0.0.1:8790", "jwks_uri": "http://127.0.0.1:8791/issuers/pinned/.well-known/jwks", "claims": [{ "namespace_id": "4000001" }] },
    { "name": "typed", "issuer": "http://127.0.0.1:8791/issuers/typed", "audience": "http://127.0.0.1:8790", "typ": "at+jwt", "claims": [{ "namespace_id": "4000001" }] }
  ],
  "defaults": { "ttl": "15m", "max_ttl": "1h" },
  "profiles": [
    { "name": "infra-cloudflare", "provider": "github", "claims": [{ "repository_id": "200000002", "ref": "refs/heads/main", "environment": "prod" }],
      "token": { "policies": [{ "permissions": ["Zone Write", "DNS Write"], "resources": { "com.cloudflare.api.account.zone.fedcba9876543210fedcba9876543210": "*" } }] } },
    { "name": "workers-deploy", "provider": "github", "claims": [{ "repository": "example-org/*", "ref": "refs/heads/main", "environment": "prod" }],
      "token": { "policies": [{ "permissions": ["Workers Scripts Write"], "resources": { "com.cloudflare.api.account.0123456789abcdef0123456789abcdef": "*" } }] } },
    { "name": "misspelled", "provider": "github", "claims": [{ "environment": "misspelled" }],
      "token": { "policies": [{ "permissions": ["Workers Scrpts Write"], "resources": { "com.cloudflare.api.account.0123456789abcdef0123456789abcdef": "*" } }] } },
    { "name": "lb-account", "provider": "github", "claims": [{ "environment": "lb-account" }],
      "token": { "policies": [{ "permissions": ["Load Balancers Write"], "resources": { "com.cloudflare.api.account.0123456789abcdef0123456789abcdef": "*" } }] } },
    { "name": "lb-zone", "provider": "github", "claims": [{ "environment": "lb-zone" }],
      "token": { "policies": [{ "permissions": ["Load Balancers Write"], "resources": { "com.cloudflare.api.account.zone.fedcba9876543210fedcba9876543210": "*" } }] } },
    { "name": "terraform-state", "provider": "github", "claims": [{ "repository": "example-org/state-*", "environment": "state" }],
      "buckets": [{ "name": "org-terraform-state", "permission": "object-read-write", "prefixes": ["github.com/{repository}/"] }] },
    { "name": "whole-bucket", "provider": "github", "claims": [{ "environment": "whole-bucket" }], "max_ttl": "30m",
      "buckets": [{ "name": "org-terraform-state", "permission": "object-read-only" }] },
    { "name": "state-and-deploy", "provider": "github", "claims": [{ "environment": "state-and-deploy" }], "ttl": "10m",
      "token": { "policies": [{ "permissions": ["Workers Scripts Write"], "resources": { "com.cloudflare.api.account.0123456789abcdef0123456789abcdef": "*" } }] },
      "buckets": [{ "name": "org-terraform-state", "permission": "object-read-write", "prefixes": ["{repository_id}/"] }] },
    { "name": "state-and-artifacts", "provider": "github", "claims": [{ "environment": "state-and-artifacts" }],
      "buckets": [{ "name": "org-terraform-state", "permission": "object-read-write", "prefixes": ["github.com/{repository}/"] }, { "name": "org-artifacts", "permission": "object-read-only" }] },
    { "name": "deploy-and-artifacts", "provider": "github", "claims": [{ "environment": "deploy-and-artifacts" }],
      "token": { "policies": [{ "permissions": ["Workers Scripts Write"], "resources": { "com.cloudflare.api.account.0123456789abcdef0123456789abcdef": "*" } }] },
      "buckets": [{ "name": "org-terraform-state", "permission": "object-read-write" }, { "name": "org-artifacts", "permission": "object-read-only" }] },
    { "name": "owner-state", "provider": "github", "claims": [{ "environment": "owner-state" }],
      "buckets": [{ "name": "org-terraform-state", "permission": "object-read-write", "prefixes": ["{repository_owner}/"] }] },
    { "name": "nix-push", "provider": "github", "audience": "https://cf-nix-cache.example.com", "claims": [{ "ref": "refs/heads/main" }] },
    { "name": "gitlab-deploy", "provider": "gitlab", "claims": [{ "project_path": "group/app", "ref_protected": "true" }],
      "token": { "policies": [{ "permissions": ["Workers Scripts Write"], "resources": { "com.cloudflare.api.account.0123456789abcdef0123456789abcdef": "*" } }] } },
    { "name": "gitlab-cache", "provider": "gitlab", "audience": "https://cf-nix-cache.example.com", "claims": [{ "project_path": "group/*" }] },
    { "name": "gitlab-state", "provider": "gitlab", "claims": [{ "project_path": "group/sub/*" }],
      "buckets": [{ "name": "org-terraform-state", "permission": "object-read-write", "prefixes": ["gitlab.com/{project_path}/", "{namespace_id}/{project_id}/"] }] },
    { "name": "pinned-cache", "provider": "pinned", "audience": "https://cf-nix-cache.example.com", "claims": [{ "namespace_id": "4000001" }] }
  ]
}
'''

# Secrets Store only: a plain `wrangler secret` is refused.
[[secrets_store_secrets]]
binding = "CF_OIDC_EXCHANGE_API_CLOUDFLARE_TOKEN"
store_id = "00000000000000000000000000000000"
secret_name = "cloudflare-token"

[[secrets_store_secrets]]
binding = "CF_OIDC_EXCHANGE_API_SIGNING_KEY"
store_id = "00000000000000000000000000000000"
secret_name = "signing-key"
