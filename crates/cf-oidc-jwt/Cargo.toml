[package]
name = "cf-oidc-jwt"
version = "0.8.0"
edition = "2024"
authors = ["iamralch"]
readme = "README.md"
description = "OIDC token verification for Cloudflare Workers: RS256 with WebCrypto, claim sets, per-isolate caches."

[dependencies]
# Decodes a token's parts.
base64 = "0.22"
# Token claims, discovery documents, key sets and claim sets.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Keys the identity cache by the SHA-256 of the token.
sha2 = { version = "0.11", default-features = false }
# Fetches issuers' keys, and reads the clock.
worker = "0.8"
# WebCrypto bindings for RS256, so no RSA crate ends up in the wasm bundle, and
# a timeout for fetching keys.
web-sys = { version = "0.3", features = ["AbortSignal", "Crypto", "CryptoKey", "SubtleCrypto", "WorkerGlobalScope"] }
