# Over the 5 KB Worker binding limit, to show the policy module has no such cap.
version: 3
issuer: https://cf-oidc-exchange.example.com
providers:
  - name: github
    issuer: https://token.actions.githubusercontent.com
    audience: https://cf-oidc-exchange.example.com
    claims:
      - repository_owner_id: "100000001"
profiles:
  - name: repo-00
    claims:
      - repository_id: "200000000"
        ref: refs/heads/main
        environment: prod
    token:
      policies:
        - permissions: ["Workers Scripts Write"]
          resources:
            "com.cloudflare.api.account.${account_id}": "*"
