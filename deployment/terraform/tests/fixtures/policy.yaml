# cf-oidc-auth policy. See crates/cf-oidc-exchange-api/README.md for the full reference.
# This file is a Terraform template: ${account_id} and ${broker_url} are filled
# in by the module, plus anything in var.policy_vars.
# All IDs below are placeholders: find yours with
#   gh api orgs/<org> --jq .id
#   gh api repos/<org>/<repo> --jq .id
version: 2

issuer: ${broker_url} # the broker's URL, filled in by Terraform

providers:
  - name: github # GitHub Actions
    issuer: https://token.actions.githubusercontent.com
    audience: ${broker_url} # what the action asks GitHub for: the broker's URL
    claims:
      repository_owner_id: "100000001" # REQUIRED: numeric org/user ID, applied to every profile

defaults:
  ttl: 15m
  max_ttl: 1h

profiles:
  - name: workers-deploy
    claims:
      repository_id: "200000002"
      ref: refs/heads/main
      environment: prod
    token:
      policies:
        - effect: allow
          permissions: ["Workers Scripts Write"] # names from the permission groups API
          resources: # Cloudflare's own token resources format
            "com.cloudflare.api.account.${account_id}": "*"
