# The broker's OAuth contract. Keep it in step with src/api.ts, which the
# action type-checks against; the Worker's tests exercise every response it lists.
openapi: 3.1.0
info:
  title: cf-oidc-broker
  version: "1"
  description: >-
    Exchanges a GitHub identity for short-lived Cloudflare credentials, or for a token the
    broker signs for another service (RFC 8693 token exchange at `POST /oauth/token`), and
    revokes Cloudflare tokens (RFC 7009 at `POST /oauth/revoke`). Services verify the
    broker's tokens with the keys at `/.well-known/jwks`.
servers:
  - url: https://cf-oidc-broker.example.com
paths:
  /oauth/token:
    post:
      operationId: exchangeToken
      summary: Exchange a GitHub OIDC or user token for a Cloudflare API token and/or R2 credentials.
      description: >-
        The subject token is in the body, not an `Authorization` header. Which profile
        applies follows the policy: a named `profile` must match, otherwise exactly one
        profile must. Anything unsupported, such as `actor_token` or another `audience`,
        is refused rather than ignored.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/TokenExchangeRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/TokenExchangeRequest"
      responses:
        "200":
          description: Issued. A profile with only buckets returns no `access_token` and `token_type` `N_A`.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenExchangeResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /oauth/revoke:
    post:
      operationId: revokeToken
      summary: Revoke a Cloudflare API token the broker minted.
      description: >-
        Holding the token is the proof. Answers `200` whether the token was revoked, already
        gone or never valid, as RFC 7009 has it, and `403` for a token the broker didn't mint,
        which it never deletes.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/TokenRevocationRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRevocationRequest"
      responses:
        "200":
          description: Revoked, already gone, or never valid. No body.
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /.well-known/openid-configuration:
    get:
      operationId: discovery
      summary: Where to find the broker's keys and endpoints.
      description: >-
        Tokens come from exchange only, so there's no authorization endpoint: the broker
        isn't a login provider.
      responses:
        "200":
          description: The discovery document. Cacheable for 5 minutes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Discovery"
        "500":
          $ref: "#/components/responses/Error"
  /.well-known/jwks:
    get:
      operationId: jwks
      summary: The public key the broker signs its own tokens with.
      responses:
        "200":
          description: A JWK Set. Empty when no signing key is bound. Cacheable for 5 minutes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Jwks"
        "500":
          $ref: "#/components/responses/Error"
components:
  responses:
    Error:
      description: >-
        Deliberately generic; the reason goes only to the broker's audit log. 400 for a
        malformed or unsupported exchange, 401 for an invalid subject token, 403 when no
        profile allows the caller, 404 when no enabled profile is for people, 500 when the
        broker is misconfigured, 502 when GitHub or Cloudflare fail.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    TokenRevocationRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 8192
        token_type_hint:
          type: string
          const: access_token
          description: Ignored; only Cloudflare API tokens the broker minted can be revoked.
    TokenExchangeRequest:
      type: object
      required: [grant_type, subject_token, subject_token_type]
      properties:
        grant_type:
          type: string
          const: urn:ietf:params:oauth:grant-type:token-exchange
        subject_token:
          type: string
          minLength: 1
          maxLength: 8192
          description: A GitHub Actions OIDC token, or a person's GitHub user token.
        subject_token_type:
          type: string
          enum:
            - urn:ietf:params:oauth:token-type:id_token
            - urn:ietf:params:oauth:token-type:jwt
            - urn:ietf:params:oauth:token-type:access_token
          description: "`id_token` or `jwt` for a GitHub Actions OIDC token, `access_token` for a GitHub user token."
        audience:
          type: string
          maxLength: 200
          default: https://api.cloudflare.com
          description: >-
            `https://api.cloudflare.com` for Cloudflare credentials, or the URL of a service
            the policy issues the broker's own tokens for.
        requested_token_type:
          $ref: "#/components/schemas/IssuedTokenType"
        profile:
          type: string
          maxLength: 64
          description: Profile to use. If omitted, exactly one profile must match.
        ttl:
          type: string
          maxLength: 16
          description: Requested lifetime such as `10m` or `1h`, capped at the profile's `max_ttl`.
        repository:
          type: string
          maxLength: 200
          pattern: "^(?:[A-Za-z0-9._-]+/[A-Za-z0-9._-]+|[0-9]+)$"
          description: Required with a GitHub user token. `owner/name` or the repo's numeric ID.
    IssuedTokenType:
      type: string
      enum:
        - urn:ietf:params:oauth:token-type:access_token
        - urn:cf-oidc-auth:params:oauth:token-type:r2-credentials
        - urn:ietf:params:oauth:token-type:jwt
    TokenExchangeResponse:
      type: object
      required: [issued_token_type, token_type, expires_in, expires_at, profile]
      properties:
        access_token:
          type: string
          description: >-
            The Cloudflare API token, absent for a profile with only buckets; or, for a
            service's audience, the JWT the broker signed.
        issued_token_type:
          $ref: "#/components/schemas/IssuedTokenType"
        token_type:
          type: string
          enum: [Bearer, N_A]
        expires_in:
          type: integer
          minimum: 0
          description: Seconds until the token, or the R2 credentials, expire.
        expires_at:
          type: integer
          description: Unix time in seconds.
        token_id:
          type: string
          description: The Cloudflare API token's ID, present with `access_token`.
        account_id:
          type: string
          description: The Cloudflare account, for the Cloudflare audience.
        profile:
          type: string
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/BucketCredentials"
    BucketCredentials:
      type: object
      description: S3 credentials for one R2 bucket, limited to `prefixes`. They can't be revoked; they expire.
      required: [name, access_key_id, secret_access_key, session_token, prefixes, endpoint, expires_on]
      properties:
        name:
          type: string
        access_key_id:
          type: string
        secret_access_key:
          type: string
        session_token:
          type: string
        prefixes:
          type: array
          items:
            type: string
          description: Filled in from the caller's claims. Empty means the whole bucket.
        endpoint:
          type: string
          format: uri
        expires_on:
          type: string
          format: date-time
    Discovery:
      type: object
      required: [issuer, jwks_uri, token_endpoint, revocation_endpoint, grant_types_supported]
      properties:
        issuer:
          type: string
          format: uri
        jwks_uri:
          type: string
          format: uri
        token_endpoint:
          type: string
          format: uri
        revocation_endpoint:
          type: string
          format: uri
        grant_types_supported:
          type: array
          items:
            type: string
        token_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
        revocation_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
        subject_types_supported:
          type: array
          items:
            type: string
        id_token_signing_alg_values_supported:
          type: array
          items:
            type: string
    Jwks:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            required: [kty, crv, x, kid, alg, use]
            properties:
              kty:
                type: string
                const: OKP
              crv:
                type: string
                const: Ed25519
              x:
                type: string
              kid:
                type: string
              alg:
                type: string
                const: EdDSA
              use:
                type: string
                const: sig
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [bad_request, unauthorized, forbidden, not_found, misconfigured, upstream_error, internal]
