# Local development and build-from-source deploys. Production deploys normally
# use the prebuilt release artifact (see terraform/).
#
# The policy is src/policy.json, bundled into the Worker. It isn't committed:
#   cp src/policy.example.json src/policy.json
name = "cf-oidc-broker"
main = "src/index.ts"
compatibility_date = "2026-08-15"

[observability]
enabled = true

[triggers]
crons = ["17 * * * *"] # hourly cleanup of expired cf-auth:* tokens

# The broker token must come from Secrets Store; a plain `wrangler secret` is
# refused. For `wrangler dev`, create it in the local store:
#   wrangler secrets-store secret create <store-id> --name cf-auth-broker-token --scopes workers
[[secrets_store_secrets]]
binding = "CF_AUTH_BROKER_TOKEN"
store_id = "00000000000000000000000000000000"
secret_name = "cf-auth-broker-token"

[vars]
CF_AUTH_BROKER_ACCOUNT_ID = "00000000000000000000000000000000"
