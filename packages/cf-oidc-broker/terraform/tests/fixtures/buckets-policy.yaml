# Profiles with buckets, for tests/main.tftest.hcl. {claim} placeholders are the
# broker's, filled in from each job's claims; $${…} is Terraform's.
version: 1
github:
  audience: ${broker_url}
  owner_id: "100000001"
profiles:
  - name: terraform-state
    match:
      ref: refs/heads/main
    ttl: 30m
    buckets:
      - name: org-terraform-state
        permission: object-read-write
        prefixes: ["github.com/{repository}/"]
  - name: deploy-with-state
    match:
      repository_id: "200000002"
      environment: prod
    token:
      policies:
        - permissions: ["Workers Scripts Write"]
          resources:
            "com.cloudflare.api.account.${account_id}": "*"
    buckets:
      - name: org-terraform-state
        permission: object-read-write
        prefixes: ["{repository_owner_id}/{repository_id}/"]
